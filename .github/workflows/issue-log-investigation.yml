name: Issue log investigation

on:
  push:
    branches: [fix/issues-31-32-disk-access]
    paths: [.github/workflows/issue-log-investigation.yml]

permissions:
  contents: read

jobs:
  read-attachments:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Download and read the two public issue attachments
        shell: python
        run: |
          import hashlib, pathlib, urllib.request, uuid
          directory = pathlib.Path('issue-logs')
          directory.mkdir(exist_ok=True)
          urls = {
              31: 'https://github.com/user-attachments/files/31909841/bsr_debug_20260907_204144.log',
              32: 'https://github.com/user-attachments/files/32155553/bsr_debug_20260913_124341.log',
          }
          stop = str(uuid.uuid4())
          print('::stop-commands::' + stop, flush=True)
          for number, url in urls.items():
              with urllib.request.urlopen(url, timeout=60) as response:
                  data = response.read(10 * 1024 * 1024 + 1)
              if len(data) > 10 * 1024 * 1024:
                  raise RuntimeError('Attachment exceeds 10 MiB limit')
              (directory / ('issue-%s.log' % number)).write_bytes(data)
              print('BEGIN ISSUE %s: %s bytes SHA256 %s' % (number, len(data), hashlib.sha256(data).hexdigest()))
              encoding = 'utf-16' if data.startswith((b'\xff\xfe', b'\xfe\xff')) else 'utf-8-sig'
              for index, line in enumerate(data.decode(encoding, errors='replace').splitlines(), 1):
                  print('%s:%04d %s' % (number, index, line))
              print('END ISSUE %s' % number)
          print('::' + stop + '::', flush=True)
      - name: Preserve downloaded logs and the exact source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: issue-investigation-inputs
          retention-days: 1
          path: |
            issue-logs/
            tools/*.ps1
            tests/
            blueStackRoot.cmd
            debug.cmd
            README.md
            CHANGELOG.md
